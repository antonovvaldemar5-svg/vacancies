[tool.poetry]
name = "pythonproject4"
version = "1.0.0"
description = "Курсовая работа: интеграция с HH.ru и PostgreSQL"
authors = ["Vladimir <antonovvaldemar5@gmail.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.31.0"
psycopg2-binary = "^2.9.9"  # Добавлено
python-dotenv = "^1.0.0"     # Добавлено

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
flake8 = "^6.0.0"
black = "^23.0.0"
isort = "^5.12.0"
mypy = "^1.0.0"
autopep8 = "^2.0.0"
requests-mock = "^1.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.flake8]
max-line-length = 120
exclude = [".git", "__pycache__", "build", "dist", ".venv", "venv", "env"]
ignore = ["E203", "W503", "C901"]
per-file-ignores = {"tests/*" = ["S101"]}