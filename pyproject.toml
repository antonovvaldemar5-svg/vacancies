[project]
name = "pythonproject4"
version = "1.0.0"
description = "Курсовая работа: интеграция с API HH.ru для поиска вакансий"
authors = [
    {name = "Vladimir", email = "antonovvaldemar5@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[tool.poetry]
name = "pythonproject4"
version = "1.0.0"
description = "Курсовая работа: интеграция с API HH.ru для поиска вакансий"
authors = ["Vladimir <antonovvaldemar5@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
flake8 = "^6.0.0"
autopep8 = "^2.0.0"
requests-mock = "^1.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=src --cov-report=term-missing --cov-report=html"

[tool.flake8]
max-line-length = 120
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "env",
    ".pytest_cache",
    ".coverage",
    "htmlcov"
]
ignore = [
    "E203",  # Пробел перед :
    "W503",  # Разрыв строки перед бинарным оператором
    "C901",  # Слишком сложная функция
]
per-file-ignores = [
    "tests/*: S101",  # Игнорировать assert в тестах
    "src/main.py: C901",  # Сложная функция user_interaction
    "tests/*: E501",  # Длинные строки в тестах
]

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true