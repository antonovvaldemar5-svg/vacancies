[project]
name = "pythonproject4"
version = "0.1.0"
description = ""
authors = [
    {name = "Vladimir",email = "antonovvaldemar5@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "black (>=26.1.0,<27.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)"
]
[tool.flake8]
max-line-length = 120
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "env"
]
ignore = [
    "E203",  # Пробел перед :
    "W503",  # Разрыв строки перед бинарным оператором
    "C901",  # Слишком сложная функция
    "E501",  # Слишком длинная строка
]
per-file-ignores = [
    "tests/*: S101",
    "src/main.py: C901"
]